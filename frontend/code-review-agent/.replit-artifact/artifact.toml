kind = "web"
previewPath = "/"
title = "CodeSense"
version = "1.0.0"
id = "artifacts/code-review-agent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20009

[services.development]
run = "pnpm --filter @workspace/code-review-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/code-review-agent", "run", "build" ]
publicDir = "artifacts/code-review-agent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20009"
BASE_PATH = "/"
